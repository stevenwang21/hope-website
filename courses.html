<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>希望文理 · 線上補課區</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0a0816;
    --bg-1: #0a0a1f;
    --surface: rgba(255,255,255,0.04);
    --surface-2: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.12);
    --text: #f0f3ff;
    --text-2: rgba(255,255,255,0.7);
    --text-3: rgba(255,255,255,0.5);
    --brand: #2d5bff;
    --brand-2: #7a5cff;
    --gold: #f6c463;
    --r-md: 12px;
    --r-lg: 18px;
  }
  html, body {
    margin: 0;
    padding: 0;
    background:
      linear-gradient(135deg,
        #ffb3d9 0%,
        #a8c8ff 28%,
        #95d8c4 55%,
        #ffe599 80%,
        #ffb088 100%);
    background-attachment: fixed;
    color: var(--text);
    font-family: "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    line-height: 1.6;
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 32px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(28px) saturate(1.4);
    -webkit-backdrop-filter: blur(28px) saturate(1.4);
    border-bottom: 1px solid rgba(13,7,38,0.18);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .nav-logo {
    font-size: 1.05rem;
    font-weight: 700;
    color: #050010;
    text-decoration: none;
    letter-spacing: 0.04em;
  }
  .nav-logo span { color: var(--gold); }
  .nav-back {
    color: var(--text-2);
    text-decoration: none;
    font-size: 0.88rem;
    transition: color 0.2s;
  }
  .nav-back:hover { color: #fff; }
  .nav-user {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 0.88rem;
    color: var(--text-2);
  }
  .nav-user strong { color: #050010; font-weight: 600; }
  .btn-ghost {
    background: rgba(255,255,255,0.4);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 0.84rem;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.18s, border-color 0.18s;
  }
  .btn-ghost:hover { background: rgba(255,255,255,0.7); border-color: rgba(91,71,188,0.30); }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  /* Page header */
  .page-head {
    text-align: center;
    margin-bottom: 48px;
  }
  .page-kicker {
    display: inline-block;
    font-size: 0.74rem;
    letter-spacing: 0.22em;
    color: var(--brand);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .page-title {
    font-size: 2.2rem;
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #3d4ecc 0%, #b91d8c 60%, #d97706 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .page-sub {
    color: #050010;
    font-size: 1rem;
    font-weight: 500;
    margin: 0;
  }

  /* Auth card */
  .auth-card {
    max-width: 420px;
    margin: 0 auto;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border: 1px solid rgba(91,71,188,0.18);
    border-radius: var(--r-lg);
    padding: 36px 32px;
    box-shadow: 0 30px 60px -22px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.10);
  }
  .auth-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    background: rgba(91,71,188,0.10);
    padding: 4px;
    border-radius: 999px;
    margin-bottom: 28px;
  }
  .auth-tab {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 500;
    padding: 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.22s, color 0.22s;
  }
  .auth-tab.is-active {
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff;
    font-weight: 600;
  }

  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 0.82rem;
    color: #050010 !important;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }
  .field input {
    width: 100%;
    padding: 12px 14px;
    background: #1a1233 !important;
    border: 1px solid rgba(255,255,255,0.20);
    border-radius: 10px;
    color: #ffffff !important;
    font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.22s, background 0.22s;
    -webkit-text-fill-color: #ffffff !important;
    caret-color: #ffffff !important;
  }
  .field input:focus {
    outline: 0;
    border-color: #8b6dff;
    background: #221842 !important;
    color: #ffffff !important;
  }
  /* placeholder 字色 */
  .field input::placeholder {
    color: rgba(255, 255, 255, 0.45);
  }
  /* 防止瀏覽器自動填入時干擾顏色 */
  .field input:-webkit-autofill,
  .field input:-webkit-autofill:hover,
  .field input:-webkit-autofill:focus {
    -webkit-text-fill-color: #ffffff !important;
    -webkit-box-shadow: 0 0 0 1000px #1a1233 inset !important;
    caret-color: #ffffff !important;
  }

  .btn-primary {
    width: 100%;
    border: 0;
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    margin-top: 8px;
    transition: transform 0.15s, box-shadow 0.18s, opacity 0.2s;
    box-shadow: 0 12px 24px -10px rgba(45,91,255,0.5);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 16px 30px -10px rgba(45,91,255,0.6); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .form-msg {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.86rem;
    display: none;
  }
  .form-msg.show { display: block; }
  .form-msg.is-error {
    background: rgba(255, 90, 110, 0.12);
    border: 1px solid rgba(255, 90, 110, 0.35);
    color: #ffb4be;
  }
  .form-msg.is-success {
    background: rgba(58, 200, 152, 0.12);
    border: 1px solid rgba(58, 200, 152, 0.35);
    color: #a8efce;
  }

  /* Course list */
  .courses-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .course-card {
    background: rgba(255,255,255,0.90);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 22px 22px 20px;
    cursor: pointer;
    transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
    text-align: left;
    color: inherit;
    text-decoration: none;
    display: block;
  }
  .course-card:hover {
    transform: translateY(-4px);
    border-color: rgba(122,92,255,0.5);
    box-shadow: 0 22px 44px -16px rgba(45,91,255,0.4);
  }
  .course-grade-tag {
    display: inline-block;
    background: rgba(45,91,255,0.18);
    color: var(--brand);
    font-size: 0.74rem;
    letter-spacing: 0.06em;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .course-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 6px;
    line-height: 1.35;
  }
  .course-meta {
    color: var(--text-3);
    font-size: 0.82rem;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: var(--r-lg);
  }
  .empty-state .icon {
    font-size: 2.4rem;
    margin-bottom: 12px;
    opacity: 0.5;
  }
  .empty-state h3 {
    margin: 0 0 8px;
    font-weight: 600;
    color: var(--text);
  }
  .empty-state p {
    margin: 0;
    color: var(--text-2);
    font-size: 0.92rem;
  }
  .empty-state .line-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    background: #06c755;
    color: #fff;
    padding: 11px 22px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.92rem;
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .empty-state .line-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px -8px rgba(6,199,85,0.6);
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text-2);
  }

  /* Watch modal */
  .watch-modal {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s;
  }
  .watch-modal[hidden] { display: none; }
  .watch-modal.is-open { opacity: 1; pointer-events: auto; }
  .watch-modal-card {
    width: min(960px, 100%);
    background: #0a0a1f;
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
    transform: scale(0.94);
    transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .watch-modal.is-open .watch-modal-card { transform: scale(1); }
  .watch-modal-head {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    gap: 14px;
  }
  .watch-modal-title { font-weight: 600; color: #fff; font-size: 1rem; }
  .watch-modal-close {
    width: 36px; height: 36px;
    background: var(--surface-2);
    border: 0;
    color: var(--text);
    border-radius: 50%;
    cursor: pointer;
    font-size: 22px;
  }
  .watch-modal-frame {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
  }
  .watch-modal-frame iframe {
    width: 100%;
    height: 100%;
    border: 0;
  }


  /* ===== 線上課程專區 - 年級卡片 (depth 4 dark theme) ===== */
  .online-grades {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    max-width: 760px;
    margin: 28px auto 0;
    gap: 14px;
  }
  .online-grade-card {
    border: 1px solid rgba(13,7,38,0.20);
    background: rgba(255,255,255,0.90);
    backdrop-filter: blur(20px) saturate(1.3);
    -webkit-backdrop-filter: blur(20px) saturate(1.3);
    border-radius: 18px;
    padding: 26px 22px 22px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 16px -8px rgba(91,71,188,0.18);
    transition: transform 0.3s cubic-bezier(0.22,1,0.36,1),
                border-color 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
  }
  .online-grade-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle at 70% 30%, rgba(217,70,239,0.10), transparent 70%);
    pointer-events: none;
  }
  .online-grade-card {
    z-index: 1;
  }
  .online-grade-card:hover {
    transform: translate(10px, -6px) scale(1.07);
    border-color: rgba(122, 92, 255, 0.6);
    box-shadow: 0 28px 60px -16px rgba(45, 91, 255, 0.55),
                0 8px 18px -6px rgba(122, 92, 255, 0.35);
    filter: brightness(1.06);
    z-index: 10;
  }
  .online-grade-card:hover .online-grade-cta {
    background: rgba(91, 110, 230, 0.28);
    transform: translateX(3px);
  }
  .online-grades { overflow: visible; }
  .online-grade-num {
    font-size: 2.6rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #3d4ecc 0%, #b91d8c 60%, #d97706 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .online-grade-tag {
    font-size: 0.7rem;
    letter-spacing: 0.18em;
    color: #2e2752;
    font-weight: 700;
    margin-top: 4px;
  }
  .online-grade-name {
    font-size: 1.15rem;
    font-weight: 700;
    color: #050010;
    margin-top: 2px;
  }
  .online-grade-status {
    font-size: 0.85rem;
    color: #050010;
    font-weight: 600;
    margin-top: 2px;
  }
  .online-grade-cta {
    margin-top: 10px;
    align-self: flex-start;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--brand);
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(91, 110, 230, 0.15);
    transition: background 0.25s, transform 0.25s;
  }
  .empty-grades-head {
    text-align: center;
    margin-bottom: 8px;
  }
  .empty-grades-head .icon {
    font-size: 2.4rem;
    margin-bottom: 8px;
    opacity: 0.55;
  }
  .empty-grades-head h3 {
    margin: 0 0 6px;
    font-weight: 600;
    color: var(--text);
    font-size: 1.25rem;
  }
  .empty-grades-head p {
    margin: 0;
    color: #050010;
    font-size: 0.95rem;
    font-weight: 500;
  }
  .empty-grades-line {
    text-align: center;
    margin-top: 32px;
  }
  @media (max-width: 720px) {
    .online-grades { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .online-grade-num { font-size: 2.2rem; }
  }
  @media (max-width: 420px) {
    .online-grades { grid-template-columns: 1fr; }
  }

  @media (max-width: 560px) {
    .container { padding: 32px 16px 60px; }
    .page-title { font-size: 1.7rem; }
    .auth-card { padding: 28px 22px; }
  }


  /* ===== 購物車 UI ===== */
  .cart-fab {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3d4ecc 0%, #6e4ee6 100%);
    border: 0;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 14px 36px -12px rgba(61,78,204,0.6),
                0 6px 14px -4px rgba(110,78,230,0.4);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }
  .cart-fab:hover { transform: translateY(-3px) scale(1.05); }
  .cart-fab svg { width: 28px; height: 28px; }
  .cart-fab .cart-count {
    position: absolute;
    top: -4px;
    right: -4px;
    background: #d97706;
    color: #fff;
    border-radius: 50%;
    min-width: 24px;
    height: 24px;
    padding: 0 6px;
    font-size: 0.78rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #fff;
  }
  .cart-fab .cart-count[hidden] { display: none; }

  .cart-drawer {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(13,7,38,0.5);
    backdrop-filter: blur(6px);
    display: flex;
    justify-content: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s;
  }
  .cart-drawer.is-open { opacity: 1; pointer-events: auto; }
  .cart-drawer[hidden] { display: none; }
  .cart-panel {
    width: min(420px, 100%);
    height: 100%;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(28px) saturate(1.4);
    -webkit-backdrop-filter: blur(28px) saturate(1.4);
    border-left: 1px solid rgba(13,7,38,0.18);
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.22,1,0.36,1);
  }
  .cart-drawer.is-open .cart-panel { transform: translateX(0); }
  .cart-head {
    padding: 22px 24px;
    border-bottom: 1px solid rgba(13,7,38,0.12);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cart-head h3 {
    margin: 0;
    color: #050010;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .cart-close {
    background: rgba(13,7,38,0.06);
    border: 1px solid rgba(13,7,38,0.12);
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    color: #050010;
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
  }
  .cart-close:hover { background: rgba(13,7,38,0.12); }

  .cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }
  .cart-empty {
    text-align: center;
    padding: 60px 20px;
    color: #050010;
  }
  .cart-empty .icon { font-size: 2.6rem; opacity: 0.4; margin-bottom: 12px; }
  .cart-empty p { margin: 4px 0; font-size: 0.92rem; }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: rgba(13,7,38,0.04);
    border: 1px solid rgba(13,7,38,0.10);
    border-radius: 12px;
    margin-bottom: 8px;
  }
  .cart-item-type {
    flex: 0 0 auto;
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, #3d4ecc 0%, #6e4ee6 100%);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cart-item-info { flex: 1 1 auto; min-width: 0; }
  .cart-item-info .grade { font-size: 0.74rem; color: #2e2752; font-weight: 600; letter-spacing: 0.05em; }
  .cart-item-info .title {
    color: #050010;
    font-size: 0.92rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cart-item-remove {
    flex: 0 0 auto;
    background: transparent;
    border: 0;
    color: #b91d8c;
    cursor: pointer;
    font-size: 18px;
    padding: 4px 8px;
    font-family: inherit;
    border-radius: 6px;
    transition: background 0.18s;
  }
  .cart-item-remove:hover { background: rgba(185,29,140,0.12); }

  .cart-foot {
    padding: 16px 20px 22px;
    border-top: 1px solid rgba(13,7,38,0.12);
    background: rgba(255,255,255,0.6);
  }
  .cart-summary {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    color: #050010;
  }
  .cart-summary .total-label { font-size: 0.86rem; }
  .cart-summary .total-count { font-weight: 700; font-size: 1.05rem; }
  .cart-checkout {
    width: 100%;
    background: #06c755;
    color: #fff;
    border: 0;
    padding: 13px;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.18s, box-shadow 0.18s;
    text-decoration: none;
  }
  .cart-checkout:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -8px rgba(6,199,85,0.55); }
  .cart-checkout:disabled { background: rgba(13,7,38,0.18); cursor: not-allowed; transform: none; }

  /* 加入購物車按鈕 (年級卡片右上角) */
  .grade-add-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(13,7,38,0.18);
    color: #3d4ecc;
    cursor: pointer;
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    font-family: inherit;

<div class="container">

        </div>

        </div>
        <div class="field">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" required placeholder="your@email.com" style="color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; caret-color: #ffffff !important; background: #1a1233 !important;" />
        </div>
        <div class="field">
          <label for="regPassword">密碼（至少 6 碼）</label>
          <input type="password" id="regPassword" required minlength="6" placeholder="••••••••" style="color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; caret-color: #ffffff !important; background: #1a1233 !important;" />

<script>
  // ★ Apps Script 後端 URL
  const API = 'https://script.google.com/macros/s/AKfycbwiYe9P9VAPicBYj8nyfCBdulmLf0JuNfNzgB8iO9Z1AqdvkwFVfm9l0RiX4S4D2Z7s/exec';
  const STORAGE_KEY = 'wfb_user_v1';

  // ----- DOM -----
  const authSection = document.getElementById('authSection');
  const myCoursesSection = document.getElementById('myCoursesSection');
  const coursesContent = document.getElementById('coursesContent');
  const welcomeTitle = document.getElementById('welcomeTitle');
  const navRight = document.getElementById('navRight');
  const tabs = document.querySelectorAll('.auth-tab');
  const loginForm = document.getElementById('loginForm');
  const registerForm = document.getElementById('registerForm');
  const loginMsg = document.getElementById('loginMsg');
  const regMsg = document.getElementById('regMsg');
  const watchModal = document.getElementById('watchModal');
  const watchFrame = document.getElementById('watchFrame');
  const watchTitle = document.getElementById('watchTitle');
  const watchClose = document.getElementById('watchClose');

  // ----- API helper -----
  async function callApi(action, data) {
    const fd = new FormData();
    fd.append('action', action);
    Object.keys(data || {}).forEach(k => fd.append(k, data[k]));
    console.log('[callApi] →', action, data);
    let res;
    try {
      res = await fetch(API, { method: 'POST', body: fd });
    } catch (e) {
      console.error('[callApi] fetch failed:', e);
      throw new Error('FETCH_FAILED: ' + (e.message || e));
    }
    console.log('[callApi] ← HTTP', res.status, res.headers.get('content-type'));
    const text = await res.text();
    console.log('[callApi] body:', text.slice(0, 500));
    try {
      return JSON.parse(text);
    } catch (e) {
      throw new Error('NOT_JSON (HTTP ' + res.status + '): ' + text.slice(0, 200));
    }
  }

  function showMsg(el, text, isError) {
    el.textContent = text;
    el.classList.remove('is-error', 'is-success');
    el.classList.add('show', isError ? 'is-error' : 'is-success');
  }
  function clearMsg(el) {
    el.classList.remove('show', 'is-error', 'is-success');
    el.textContent = '';
  }

  // ----- Auth state -----
  function getUser() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); }
    catch (e) { return null; }
  }
  function setUser(user) { localStorage.setItem(STORAGE_KEY, JSON.stringify(user)); }
  function clearUser() { localStorage.removeItem(STORAGE_KEY); }

  // ----- Tab switching -----
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const mode = tab.dataset.mode;
      tabs.forEach(t => t.classList.toggle('is-active', t === tab));
      loginForm.hidden = mode !== 'login';
      registerForm.hidden = mode !== 'register';
      clearMsg(loginMsg); clearMsg(regMsg);
    });
  });

  // ----- Login -----
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg(loginMsg);
    const btn = loginForm.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = '登入中…';
    try {
      const r = await callApi('login', {
        email: document.getElementById('loginEmail').value.trim(),
        password: document.getElementById('loginPassword').value
      });
      if (r.ok) {
        setUser({ email: r.email, name: r.name });
        showMyCourses();
      } else {
        showMsg(loginMsg, r.error || '登入失敗', true);
      }
    } catch (err) {
      showMsg(loginMsg, '錯誤：' + (err.message || err), true);
      console.error(err);
    } finally {
      btn.disabled = false; btn.textContent = '登入';
    }
  });

  // ----- Register -----
  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg(regMsg);
    const btn = registerForm.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = '註冊中…';
    try {
      const r = await callApi('register', {
        name: document.getElementById('regName').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        password: document.getElementById('regPassword').value
      });
      if (r.ok) {
        setUser({ email: r.email, name: r.name });
        showMyCourses();
      } else {
        showMsg(regMsg, r.error || '註冊失敗', true);
      }
    } catch (err) {
      showMsg(regMsg, '錯誤：' + (err.message || err), true);
      console.error(err);
    } finally {
      btn.disabled = false; btn.textContent = '註冊';
    }
  });

  // ----- My courses -----
  async function showMyCourses() {
    const user = getUser();
    if (!user) return;
    ensureCartUI();
    authSection.hidden = true;
    myCoursesSection.hidden = false;
    welcomeTitle.textContent = (user.name || '您') + '，您的線上補課區';
    navRight.innerHTML = `
      <span class="nav-user">
        <strong>${escapeHtml(user.name || user.email)}</strong>
        <button class="btn-ghost" id="logoutBtn">登出</button>
      </span>
    `;
    document.getElementById('logoutBtn').addEventListener('click', () => {
      clearUser(); location.reload();
    });

    coursesContent.innerHTML = '<div class="loading">載入您的課程中…</div>';
    try {
      const r = await callApi('myChapters', { email: user.email });
      if (!r.ok) {
        coursesContent.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>載入失敗</h3><p>${escapeHtml(r.error || '請稍後再試')}</p></div>`;
        return;
      }
      if (!r.chapters || r.chapters.length === 0) {
        renderEmptyGrades();
        return;
      }

      coursesContent.innerHTML = '<div class="courses-grid">' +
        r.chapters.map(c => `
          <a class="course-card" href="#" data-yt="${escapeHtml(c.youtube_id)}" data-title="${escapeHtml(c.title)}">
            <span class="course-grade-tag">${escapeHtml(c.grade)}</span>
            <h3 class="course-title">${escapeHtml(c.title)}</h3>
            <div class="course-meta">點擊開始觀看 →</div>
          </a>
        `).join('') +
        '</div>';

      coursesContent.querySelectorAll('.course-card').forEach(card => {
        card.addEventListener('click', (e) => {
          e.preventDefault();
          openWatch(card.dataset.yt, card.dataset.title);
        });
      });
    } catch (err) {
      coursesContent.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><h3>載入失敗</h3><p>網路錯誤，請稍後再試</p></div>`;
    }
  }


  // ----- 空狀態：6 個年級卡片 + 章節展開 -----
  // 章節資料 (示範用，可以替換)
  const GRADE_CHAPTERS = {
    g6:  { name: '國六', tag: 'GRADE 6',  num: '6',  chapters: ['第1章 數的世界', '第2章 量與測量', '第3章 圖形與空間', '第4章 比與比例', '第5章 統計與機率'] },

  // ===== 購物車狀態 =====
  const CART_KEY = 'wfb_cart_v1';
  function getCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); }
    catch (e) { return []; }
  }
  function saveCart(arr) { localStorage.setItem(CART_KEY, JSON.stringify(arr)); updateCartBadge(); }
  function inCart(id) { return getCart().some(x => x.id === id); }
  function addToCart(item) {
    const cart = getCart();
    if (cart.some(x => x.id === item.id)) return false;
    cart.push(item);
    saveCart(cart);
    return true;
  }
  function removeFromCart(id) {
    saveCart(getCart().filter(x => x.id !== id));
  }
  function makeId(grade, ch) { return ch ? `${grade}::${ch}` : `${grade}::ALL`; }

  function showCartToast(msg) {
    let t = document.getElementById('cartToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'cartToast';
      t.className = 'cart-toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('is-show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('is-show'), 1800);
  }

  function updateCartBadge() {
    const fab = document.getElementById('cartFab');
    if (!fab) return;
    const count = getCart().length;
    const badge = fab.querySelector('.cart-count');
    if (count > 0) {
      badge.textContent = count;
      badge.hidden = false;
    } else {
      badge.hidden = true;
    }
    // refresh open drawer if any
    if (document.getElementById('cartDrawer') && document.getElementById('cartDrawer').classList.contains('is-open')) {
      renderCartItems();
    }
  }

  function openCartDrawer() {
    const d = document.getElementById('cartDrawer');
    d.hidden = false;
    requestAnimationFrame(() => d.classList.add('is-open'));
    renderCartItems();
    document.body.style.overflow = 'hidden';
  }
  function closeCartDrawer() {
    const d = document.getElementById('cartDrawer');
    d.classList.remove('is-open');
    setTimeout(() => { d.hidden = true; }, 320);
    document.body.style.overflow = '';
  }
  function renderCartItems() {
    const list = document.getElementById('cartItemsList');
    const total = document.getElementById('cartTotalCount');
    const btn = document.getElementById('cartCheckoutBtn');
    const cart = getCart();
    total.textContent = cart.length + ' 項';

    if (cart.length === 0) {
      list.innerHTML = `
        <div class="cart-empty">
          <div class="icon">🛒</div>
          <p>購物車還沒有任何課程</p>
          <p style="font-size:0.84rem;opacity:0.7">點年級卡片右上角的「+」加入</p>
        </div>
      `;
      btn.style.opacity = '0.5';
      btn.style.pointerEvents = 'none';
      return;
    }

    btn.style.opacity = '';
    btn.style.pointerEvents = '';
    list.innerHTML = cart.map(item => `
      <div class="cart-item" data-id="${escapeHtml(item.id)}">
        <div class="cart-item-type">${escapeHtml(item.typeLabel)}</div>
        <div class="cart-item-info">
          <div class="grade">${escapeHtml(item.gradeName)}</div>
          <div class="title">${escapeHtml(item.label)}</div>
        </div>
        <button type="button" class="cart-item-remove" data-id="${escapeHtml(item.id)}" aria-label="移除">×</button>
      </div>
    `).join('');

    list.querySelectorAll('.cart-item-remove').forEach(b => {
      b.addEventListener('click', () => {
        removeFromCart(b.dataset.id);
        renderCartItems();
        showCartToast('已從購物車移除');
      });
    });

    // override checkout to include item summary in clipboard hint (optional)
    btn.onclick = (e) => {
      const summary = cart.map(x => `• ${x.gradeName} ${x.label}`).join('\n');
      try { navigator.clipboard.writeText('我想購買以下課程：\n' + summary); } catch (e) {}
      showCartToast('已複製清單到剪貼簿，可貼到 LINE');
    };
  }

  function selectGrade(g) {
    const grid = document.getElementById('gradesGrid');
    if (!grid) return;
    const d = GRADE_CHAPTERS[g];
    if (!d) return;

    // remove existing chapter panel if any
    const existing = grid.querySelector('.chapters-panel');
    if (existing) existing.remove();

    // create chapter panel
    const panel = document.createElement('div');
    panel.className = 'chapters-panel';
    panel.innerHTML = `
      <div class="chapters-head">
        <h4>${escapeHtml(d.name)} · 章節列表</h4>
        <div style="display:flex; gap:8px; align-items:center;">
          <button type="button" class="chapters-add-all" id="chaptersAddAllBtn">+ 全部加入</button>
          <button type="button" class="chapters-back" id="chaptersBackBtn">← 返回</button>
        </div>
      </div>
      <div class="chapters-list">
        ${d.chapters.map((ch, i) => {
          // Support both string (flat) and object (nested with subs)
          if (typeof ch === 'string') {
            const cid = makeId(g, ch);
            const cAdded = inCart(cid);
            return `
              <div class="chapter-item" data-ch="${escapeHtml(ch)}">
                <span class="ch-num">${i+1}</span>
                <span class="ch-title">${escapeHtml(ch)}</span>
                <button type="button" class="ch-add ${cAdded?'is-added':''}" data-ch-add="${escapeHtml(ch)}" aria-label="加入購物車">${cAdded?'✓':'+'}</button>
              </div>
            `;
          } else {
            // Nested: title + count, expand to show subs
            const subCount = Math.ceil(ch.count);
            const allId = makeId(g, ch.title);
            const allAdded = inCart(allId);
            const subsHtml = Array.from({length: subCount}, (_, k) => {
              const subTitle = ch.title + (k+1);
              const sid = makeId(g, subTitle);
              const sAdded = inCart(sid);
              return `
                <div class="chapter-sub" data-sub="${escapeHtml(subTitle)}">
                  <span class="sub-num">${k+1}</span>
                  <span class="sub-title">${escapeHtml(subTitle)}</span>
                  <button type="button" class="sub-add ${sAdded?'is-added':''}" data-sub-add="${escapeHtml(subTitle)}" aria-label="加入購物車">${sAdded?'✓':'+'}</button>
                </div>
              `;
            }).join('');
            return `
              <button type="button" class="chapter-main" data-main-title="${escapeHtml(ch.title)}">
                <svg class="ch-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
                <span class="ch-num">${i+1}</span>
                <span class="ch-title-main">${escapeHtml(ch.title)}</span>
                <span class="ch-count-badge">${ch.count} 堂</span>
                <span class="ch-add-all ${allAdded?'is-added':''}" data-main-add="${escapeHtml(ch.title)}" aria-label="加入整個主題">${allAdded?'✓':'+'}</span>
              </button>
              <div class="chapter-subs">${subsHtml}</div>
            `;
          }
        }).join('')}
      </div>
      <div class="chapters-hint">
        💡 章節僅供預覽，購買後即可在此觀看完整影片。
      </div>
    `;
    // insert panel BEFORE all cards (will be on left in grid)
    grid.insertBefore(panel, grid.firstChild);

    // toggle states
    grid.classList.add('is-detail-open');
    grid.querySelectorAll('.online-grade-card').forEach(c => {
      c.classList.toggle('is-selected', c.dataset.grade === g);
    });

    // back button
    document.getElementById('chaptersBackBtn').addEventListener('click', () => {
      grid.classList.remove('is-detail-open');
      grid.querySelectorAll('.online-grade-card').forEach(c => c.classList.remove('is-selected'));
      panel.remove();
    });

    // chapter click → for now, alert. Will hook to YouTube later when student has purchased.
    panel.querySelectorAll('.ch-add').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const ch = btn.dataset.chAdd;
        const cid = makeId(g, ch);
        if (inCart(cid)) {
          removeFromCart(cid);
          btn.classList.remove('is-added');
          btn.textContent = '+';
          showCartToast(d.name + ' 「' + ch + '」已移除');
        } else {
          addToCart({ id: cid, type: 'chapter', typeLabel: '章', grade: g, gradeName: d.name, label: ch });
          btn.classList.add('is-added');
          btn.textContent = '✓';
          showCartToast(d.name + ' 「' + ch + '」已加入');
        }
      });
    });

    // === 巢狀章節：主題展開/收合 ===
    panel.querySelectorAll('.chapter-main').forEach(btn => {
      btn.addEventListener('click', (e) => {
        // 如果點到 + 按鈕就不切換展開
        if (e.target.closest('.ch-add-all')) return;
        btn.classList.toggle('is-open');
      });
    });

    // === 巢狀：主題 + 全部加入購物車 ===
    panel.querySelectorAll('.ch-add-all').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const title = btn.dataset.mainAdd;
        // find spec
        const ch = d.chapters.find(x => typeof x === 'object' && x.title === title);
        if (!ch) return;
        const subCount = Math.ceil(ch.count);
        const subTitles = Array.from({length: subCount}, (_, k) => title + (k+1));
        const allInCart = subTitles.every(t => inCart(makeId(g, t)));
        if (allInCart) {
          // remove all
          subTitles.forEach(t => removeFromCart(makeId(g, t)));
          btn.classList.remove('is-added');
          btn.textContent = '+';
          // update sub buttons
          panel.querySelectorAll('.sub-add').forEach(sb => {
            if (subTitles.includes(sb.dataset.subAdd)) {
              sb.classList.remove('is-added'); sb.textContent = '+';
            }
          });
          showCartToast(d.name + ' ' + title + ' 全部移除');
        } else {
          subTitles.forEach(t => {
            const id = makeId(g, t);
            if (!inCart(id)) addToCart({ id, type: 'chapter', typeLabel: '章', grade: g, gradeName: d.name, label: t });
          });
          btn.classList.add('is-added');
          btn.textContent = '✓';
          panel.querySelectorAll('.sub-add').forEach(sb => {
            if (subTitles.includes(sb.dataset.subAdd)) {
              sb.classList.add('is-added'); sb.textContent = '✓';
            }
          });
          showCartToast(d.name + ' ' + title + ' (' + subCount + ' 堂) 已加入');
        }
      });
    });

    // === 巢狀：個別子章節加入 ===
    panel.querySelectorAll('.sub-add').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const sub = btn.dataset.subAdd;
        const sid = makeId(g, sub);
        if (inCart(sid)) {
          removeFromCart(sid);
          btn.classList.remove('is-added');
          btn.textContent = '+';
          showCartToast(d.name + ' 「' + sub + '」已移除');
        } else {
          addToCart({ id: sid, type: 'chapter', typeLabel: '章', grade: g, gradeName: d.name, label: sub });
          btn.classList.add('is-added');
          btn.textContent = '✓';
          showCartToast(d.name + ' 「' + sub + '」已加入');
        }
      });
    });

    // 全部加入按鈕
    const addAllBtn = document.getElementById('chaptersAddAllBtn');
    if (addAllBtn) {
      addAllBtn.addEventListener('click', () => {
        const id = makeId(g, null);
        if (!inCart(id)) {
          addToCart({ id, type: 'grade', typeLabel: '全', grade: g, gradeName: d.name, label: '整個年級課程' });
        }
        d.chapters.forEach(ch => {
          if (typeof ch === 'string') {
            const cid = makeId(g, ch);
            if (!inCart(cid)) addToCart({ id: cid, type: 'chapter', typeLabel: '章', grade: g, gradeName: d.name, label: ch });
          } else {
            const subCount = Math.ceil(ch.count);
            for (let k = 1; k <= subCount; k++) {
              const sub = ch.title + k;
              const cid = makeId(g, sub);
              if (!inCart(cid)) addToCart({ id: cid, type: 'chapter', typeLabel: '章', grade: g, gradeName: d.name, label: sub });
            }
          }
        });
        // refresh all buttons
        panel.querySelectorAll('.ch-add, .ch-add-all, .sub-add').forEach(btn => {
          btn.classList.add('is-added');
          btn.textContent = '✓';
        });
        showCartToast(d.name + ' 全部章節已加入購物車');
      });
    }
  }

    document.body.style.overflow = 'hidden';
  }
  function closeWatch() {
    watchModal.classList.remove('is-open');
    setTimeout(() => {
      watchModal.hidden = true;
      watchFrame.src = '';
    }, 280);
    document.body.style.overflow = '';
  }
  watchClose.addEventListener('click', closeWatch);
  watchModal.addEventListener('click', (e) => {
    if (e.target === watchModal) closeWatch();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !watchModal.hidden) closeWatch();
  });

  // ----- Helpers -----
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ----- Init: 已登入則直接跳到課程頁 -----
  if (getUser()) {
    showMyCourses();
  }

  // ----- 預覽模式: 不打 API 直接顯示空狀態版面 (?preview=empty) -----
  if (location.search.includes('preview=empty')) {
    setUser({ email: 'preview@local', name: '預覽模式' });
    authSection.hidden = true;
    myCoursesSection.hidden = false;
    welcomeTitle.textContent = '預覽：您的線上補課區';
    navRight.innerHTML = '<button class="btn-ghost" onclick="localStorage.removeItem(\'wfb_user_v1\'); location.href=\'courses.html\';">退出預覽</button>';
    renderEmptyGrades();
  }
</script>

</body>
</html>

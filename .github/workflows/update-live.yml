name: 檢查直播狀態 (YouTube)

on:
  schedule:
    # 每三小時檢查一次（UTC，台灣時間也是每三小時）
    - cron: '10 */3 * * *'
  workflow_dispatch: {}        # 可在 GitHub Actions 頁面手動按「Run workflow」
  push:
    branches: [main]
    paths:
      - scripts/fetch-live.js
      - .github/workflows/update-live.yml

permissions:
  contents: write

concurrency:
  group: update-live
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 檢查 YouTube 直播狀態
        run: node scripts/fetch-live.js

      - name: 有變動才 commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          if git diff --cached --quiet; then
            echo "直播狀態沒有變化，不用 commit"
            exit 0
          fi
          git commit -m "chore: 更新直播狀態 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push origin HEAD:main
